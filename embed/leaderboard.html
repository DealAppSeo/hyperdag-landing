<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trust Leaderboard — powered by HyperDAG.org</title>
<style>
  :root{
    --bg:transparent; --ink:#17140f; --soft:#6b6559; --line:#e4dfd3; --card:#fdfcf9;
    --accent:#0e6f6e; --good:#1e7a46; --gold:#9a7b2e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--ink:#ece9e2;--soft:#a19c90;--line:#2a2e33;--card:#191c20;--accent:#3fb8af;--good:#4fb980;--gold:#cda95e;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .lb{max-width:640px;margin:0 auto;padding:8px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:2px}
  .top h2{font-size:18px;margin:0;letter-spacing:-.01em}
  .metric{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
  .narr{color:var(--soft);font-size:13px;margin:6px 0 12px;line-height:1.5}
  .tabs{display:inline-flex;gap:2px;background:var(--line);border-radius:9px;padding:2px;margin-bottom:10px}
  .tab{border:0;background:transparent;color:var(--soft);font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:500}
  td:first-child{color:var(--soft);font-family:var(--mono);width:26px}
  tr:first-child td:first-child{color:var(--gold);font-weight:700}
  .m{font-weight:600}
  .cls{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--soft);margin-left:6px}
  .free{color:var(--good)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--soft)}
  .foot a{color:var(--accent);text-decoration:none}
  .disc{font-style:italic}
  .powered{font-family:var(--mono);letter-spacing:.03em}
  .state{color:var(--soft);padding:24px 8px;text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="lb" id="lb"><div class="state">Loading the leaderboard…</div></div>
<script>
(function(){
  var API = (document.currentScript && document.currentScript.dataset.api) || 'https://repid-engine-production.up.railway.app/api/v1/leaderboard/models';
  var el = document.getElementById('lb');
  var state = 'performance', data = null;
  function fmt(n,d){ return (n===null||n===undefined)?'—':Number(n).toFixed(d); }
  function render(){
    if(!data){ el.innerHTML='<div class="state">Leaderboard unavailable right now.</div>'; return; }
    var lens = data.lenses[state], rows = (lens.models||[]).slice(0,10);
    var body = rows.map(function(r){
      var free = Number(r.cost_per_1m)===0;
      return '<tr><td>'+r.rank+'</td>'+
        '<td><span class="m">'+r.model_id+'</span><span class="cls'+(free?' free':'')+'">'+(r.class||'')+(free?' · free':'')+'</span></td>'+
        '<td>'+fmt(r.accuracy,2)+'</td><td>'+fmt(r.brier,3)+'</td>'+
        '<td>'+(r.latency_ms||'—')+'ms</td><td>$'+fmt(r.cost_per_1m,1)+'</td></tr>';
    }).join('');
    el.innerHTML =
      '<div class="top"><h2>AI Trust Leaderboard</h2><span class="metric">'+data.metric+'</span></div>'+
      '<p class="narr">'+data.narrative+'</p>'+
      '<div class="tabs" role="tablist">'+
        '<button class="tab" role="tab" aria-selected="'+(state==='performance')+'" data-l="performance">Performance <small>(money no object)</small></button>'+
        '<button class="tab" role="tab" aria-selected="'+(state==='value')+'" data-l="value">Value <small>(per dollar)</small></button>'+
      '</div>'+
      '<table><thead><tr><th>#</th><th>Model</th><th>Acc</th><th>Brier</th><th>Speed</th><th>$/1M</th></tr></thead><tbody>'+body+'</tbody></table>'+
      '<div class="foot"><span class="disc">'+data.disclaimer+'</span>'+
        '<a class="powered" href="https://hyperdag.org">▲ powered by HyperDAG.org</a></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.tab'), function(t){
      t.onclick=function(){ state=t.dataset.l; render(); };
    });
  }
  fetch(API).then(function(r){return r.json();}).then(function(j){ data=j; render(); })
    .catch(function(){ el.innerHTML='<div class="state">Leaderboard unavailable right now.</div>'; });
})();
</script>
</body>
</html>
