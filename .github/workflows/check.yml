# Minimal CI for hyperdag-landing.
#
# WHY THIS EXISTS. This repository had no CI at all -- no gate of any kind ran
# on a push or a pull request.
#
# An assessment on 2026-08-14 initially reported this site as serving content
# from no commit, built from the wrong repository. **That was retracted**: it
# read deployment state off `hyperdag-org` (a project that serves no custom
# domain -- the site is served by `hyperdag-trust`), and compared a character
# count against a byte count of the same file. The live page is md5-identical to
# the committed index.html, and the production deploy is READY at main HEAD.
#
# The deployment was healthy. The absence of CI was not, and remains the real
# finding: nothing here verified that a change was even well-formed before it
# went out. This workflow is that floor -- deliberately small, because the repo
# is a static page plus one Vercel zero-config function.
#
# Deliberately tiny, because the repo is tiny: a static site plus one Vercel
# zero-config function. Every step here was executed against this tree before
# being written.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The functions under /api are CommonJS -- there is no package.json here,
      # so a .js file is CJS and ESM syntax would fail at RUNTIME rather than at
      # deploy time. `node --check` is what turns that into a build-time error.
      - name: Syntax-check serverless functions
        run: |
          shopt -s nullglob
          files=(api/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No /api functions found — nothing to check."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      # A zero-length or missing index.html deploys "successfully" and serves a
      # blank page -- an empty-but-green deploy. This is not hypothetical here:
      # commit b7274ba deleted index.html outright, and nothing in this repo
      # would have objected.
      - name: index.html is present and non-trivial
        run: |
          test -f index.html || { echo "index.html is missing"; exit 1; }
          bytes=$(wc -c < index.html)
          echo "index.html is ${bytes} bytes"
          test "$bytes" -gt 500 || { echo "index.html is implausibly small"; exit 1; }
